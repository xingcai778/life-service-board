let state={bm:'26BM3',ind:'餐饮'};

function buildNav(){
  document.getElementById('sub-nav').innerHTML=INDUSTRIES.map(ind=>
    `<button class="sub-btn ${state.ind===ind?'active':''}" onclick="switchInd('${ind}')">${IND_ICONS[ind]} ${IND_LABELS[ind]}</button>`
  ).join('');
}

function switchInd(ind){
  state.ind=ind;
  document.getElementById('bc-cur').textContent=ind+' 代理推荐';
  buildNav();
  document.getElementById('main').innerHTML=buildIndustryPage(ind);
}

function onBmChange(){
  state.bm=document.getElementById('bm-sel').value;
  switchInd(state.ind);
}

function buildIndustryPage(ind){
  const data=ALL_DATA[state.bm];
  if(!data||!data[ind])return '<div class="page" style="text-align:center;padding:60px;color:#999">暂无该考核期数据</div>';
  const info=data[ind];
  const hasSubModules=info.sub_modules&&Object.keys(info.sub_modules).length>0;
  let html=`<div class="page">
    <div class="ind-hd"><h2>${IND_ICONS[ind]} ${IND_LABELS[ind]}</h2><span class="badge-stat">参评 ${info.total_nk} 家 · 达标 ${info.passed} · 潜力 ${info.potential}</span></div>`;
  if(hasSubModules){
    const moduleIcons={'少儿兴趣硬件图书':'🧸','学科教育':'📚','语言留学':'🌍','成人职业兴趣':'💼'};
    for(const [moduleName,moduleAgents] of Object.entries(info.sub_modules)){
      const icon=moduleIcons[moduleName]||'📋';
      const mp=moduleAgents.filter(a=>a.category==='达标');
      const mt=moduleAgents.filter(a=>a.category==='潜力');
      const mo=moduleAgents.filter(a=>a.category!=='达标'&&a.category!=='潜力');
      html+=`<div style="margin-bottom:24px"><div class="sec-label" style="color:#1a1a1a;font-size:14px;border-bottom:1px solid #e8e3db;padding-bottom:8px">${icon} ${moduleName} <span style="font-size:11px;color:#999;font-weight:400;margin-left:6px">推荐 ${moduleAgents.length} 家</span></div>`;
      if(mp.length)html+=`<div class="sec-label green" style="margin-top:12px">✅ 优质代理 ${mp.length} 家</div><div class="agent-grid">${mp.map(a=>cardHtml(a)).join('')}</div>`;
      if(mt.length)html+=`<div class="sec-label amber"> 潜力代理 ${mt.length} 家</div><div class="agent-grid">${mt.map(a=>cardHtml(a)).join('')}</div>`;
      if(mo.length)html+=`<div class="sec-label gray">— 其他代理 ${mo.length} 家</div><div class="agent-grid">${mo.map(a=>cardHtml(a)).join('')}</div>`;
      html+=`</div>`;
    }
  }else{
    const agents=info.agents||[];
    const passed=agents.filter(a=>a.category==='达标');
    const potential=agents.filter(a=>a.category==='潜力');
    const other=agents.filter(a=>a.category!=='达标'&&a.category!=='潜力');
    if(passed.length)html+=`<div class="sec-label green">✅ 优质代理 ${passed.length} 家</div><div class="agent-grid">${passed.map(a=>cardHtml(a)).join('')}</div>`;
    if(potential.length)html+=`<div class="sec-label amber"> 潜力代理 ${potential.length} 家</div><div class="agent-grid">${potential.map(a=>cardHtml(a)).join('')}</div>`;
    if(other.length)html+=`<div class="sec-label gray">— 其他代理 ${other.length} 家</div><div class="agent-grid">${other.map(a=>cardHtml(a)).join('')}</div>`;
  }
  html+=`</div>`;
  return html;
}

function cardHtml(a){

  const badgeCol=a.category==='达标'?'#059669':a.category==='潜力'?'#d97706':'#6b7280';

  const logoHtml=a.logo?`<img src="${a.logo}" alt="" style="width:42px;height:42px;object-fit:contain;border-radius:6px;background:#fafafa;padding:4px;margin-right:12px;flex-shrink:0;border:1px solid #f0f0f0">`:`<div style="width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;margin-right:12px;flex-shrink:0">${a.name.charAt(0)}</div>`;
  const introId='intro_'+a.name.replace(/[^a-zA-Z0-9一-龥]/g,'');
  const introSection=a.intro?`<div style="margin-bottom:12px"><div id="${introId}" style="font-size:12.5px;color:#555;line-height:1.7;max-height:56px;overflow:hidden;transition:max-height 0.3s ease">${a.intro}</div><button onclick="toggleIntro('${introId}',this)" style="background:none;border:none;color:#2563eb;cursor:pointer;font-size:12px;padding:2px 0;margin-top:2px;font-weight:500">展开全部</button></div>`:'';
  const dimsHtml=a.passed_dims&&a.passed_dims.length?`<div style="margin-top:14px"><div style="font-size:11px;color:#999;margin-bottom:6px;font-weight:600;letter-spacing:0.5px">达标维度</div><div style="display:flex;flex-wrap:wrap;gap:5px">${a.passed_dims.map(d=>`<span style="background:#f0f9ff;color:#0369a1;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:500;border:1px solid #e0f2fe">${d}</span>`).join('')}</div></div>`:'';
  const pdfBtn=a.pdf_url?`<a href="${a.pdf_url}" target="_blank" style="display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border:1.5px solid #2563eb;border-radius:20px;font-size:12px;color:#2563eb;background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%);font-weight:500;cursor:pointer;transition:all 0.2s;box-shadow:0 1px 3px rgba(37,99,235,0.1);text-decoration:none" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 2px 6px rgba(37,99,235,0.2)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 1px 3px rgba(37,99,235,0.1)'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>查看介绍</a>`:a.pdf_text?`<button onclick="showCompanyIntro('${a.name.replace(/'/g,"\\'")}')" style="display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border:1.5px solid #2563eb;border-radius:20px;font-size:12px;color:#2563eb;background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%);font-weight:500;cursor:pointer;transition:all 0.2s;box-shadow:0 1px 3px rgba(37,99,235,0.1)" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 2px 6px rgba(37,99,235,0.2)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 1px 3px rgba(37,99,235,0.1)'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>查看介绍</button>`:`<span style="display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1px dashed #d1d5db;border-radius:20px;font-size:12px;color:#9ca3af;background:#f9fafb;cursor:default"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>待补充</span>`;
  const pdfSection=`<div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap">${pdfBtn}</div>`;
  const contactHtml=a.contact?`<div style="margin-top:12px;padding-top:10px;border-top:1px solid #f5f5f5;font-size:11.5px;color:#888;line-height:1.7">${a.contact}</div>`:'';
  return `<div style="background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,0.04);border-left:3px solid ${borderCol};transition:box-shadow 0.2s" onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,0.08)'" onmouseout="this.style.boxShadow='0 1px 4px rgba(0,0,0,0.04)'"><div style="display:flex;align-items:flex-start;margin-bottom:4px">${logoHtml}<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:#111;line-height:1.4;margin-bottom:4px">${a.name}</div></div><span style="background:${badgeBg};color:${badgeCol};padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;margin-left:8px">${badgeIcon} ${badgeTxt}</span>${tagsHtml}</div>${introSection}${dimsHtml}${pdfSection}${contactHtml}</div>`;
}

function toggleIntro(id,btn){
  const el=document.getElementById(id);
  if(el.style.maxHeight==='none'){el.style.maxHeight='56px';btn.textContent='展开全部'}
  else{el.style.maxHeight='none';btn.textContent='收起'}
}

buildNav();
switchInd('餐饮');
</script>

<!-- 公司介绍弹窗 -->
<div id="company-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)closeCompanyIntro()">
  <div style="background:#fff;border-radius:16px;max-width:640px;width:90%;max-height:80vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.15);animation:modalIn 0.2s ease">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #f0f0f0">
      <h3 id="modal-title" style="font-size:16px;font-weight:600;color:#111;margin:0"></h3>
      <button onclick="closeCompanyIntro()" style="background:none;border:none;font-size:20px;color:#999;cursor:pointer;padding:4px 8px;border-radius:4px" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='none'">✕</button>
    </div>
    <div id="modal-content" style="padding:24px;overflow-y:auto;max-height:calc(80vh - 70px);font-size:14px;line-height:1.8;color:#444"></div>
  </div>
</div>
<script>
function showCompanyIntro(name){
  const data=ALL_DATA[state.bm];
  let intro='';
  for(const ind of Object.values(data)){
    if(ind.sub_modules){
      for(const agents of Object.values(ind.sub_modules)){
        for(const a of agents){if(a.name===name&&a.pdf_text){intro=a.pdf_text;break;}}
        if(intro)break;
      }
    }
    if(!intro&&ind.agents){
      for(const a of ind.agents){if(a.name===name&&a.pdf_text){intro=a.pdf_text;break;}}
    }
    if(intro)break;
  }
  document.getElementById('modal-title').textContent=name;
  document.getElementById('modal-content').textContent=intro||'暂无公司介绍';
  document.getElementById('company-modal').style.display='flex';
}
function closeCompanyIntro(){document.getElementById('company-modal').style.display='none';}
</script>
<style>
@keyframes modalIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
</style>
</body>
</html>
